<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Packwise{% endblock %} · Packwise</title>
  <style>
    :root{--ink:#172b3a;--muted:#5f7180;--brand:#176b5b;--bg:#f2f6f4;--line:#dce6e1;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif}
    header{background:var(--white);border-bottom:1px solid var(--line)}.nav{max-width:1000px;margin:auto;padding:15px 20px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
    .brand{font-size:1.2rem;font-weight:800;color:var(--brand);margin-right:auto}.nav a{color:var(--ink);text-decoration:none;font-weight:600}.nav a:hover{color:var(--brand)}
    main{max-width:1000px;margin:35px auto;padding:0 20px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 6px 18px #183a2b08}
    h1{line-height:1.15;font-size:clamp(2rem,5vw,3rem);margin:0 0 12px}h2{margin-top:0}p{color:var(--muted)}.button{display:inline-block;background:var(--brand);color:#fff;padding:10px 16px;border:0;border-radius:8px;text-decoration:none;font-weight:700;cursor:pointer}
    .button.secondary{background:#e6f1ed;color:var(--brand)}label{font-weight:650;display:block;margin:10px 0 4px}input,select{width:100%;padding:10px;border:1px solid #c5d3cc;border-radius:7px;font:inherit}form p{margin:0}.errorlist{color:#a12626;padding-left:20px}.messages{padding:12px;background:#e6f1ed;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.status{font-size:1.1rem;font-weight:750;color:var(--brand)}footer{max-width:1000px;margin:40px auto;padding:0 20px 30px;color:var(--muted)}
    @media(max-width:600px){.nav{gap:12px}.card{padding:17px}main{margin-top:24px}table{font-size:.9rem}}
  </style>
</head>
<body>
<header><nav class="nav"><a class="brand" href="{% url 'home' %}">Packwise</a><a href="{% url 'product_list' %}">Products</a><a href="{% url 'box_list' %}">Boxes</a><a href="{% url 'order_create' %}">New order</a></nav></header>
<main>{% if messages %}<div class="messages">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main>
<footer>Packwise · Explainable packaging recommendations</footer>
</body></html>
